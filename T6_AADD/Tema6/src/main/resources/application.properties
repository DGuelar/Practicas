# --- CONEXIÓN A BASE DE DATOS (base VACÍA para la prueba) ---
spring.datasource.url=jdbc:mysql://localhost:3306/hr_spring?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULLspring.datasource.username=root
